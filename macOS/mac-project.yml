name: QuotaGlanceMac
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 51
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
targets:
  QuotaGlance:
    type: application
    platform: macOS
    sources:
      - Sources/QuotaGlance
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/CodexPet.webp
        buildPhase: resources
      - path: Resources/ClawdIdle.png
        buildPhase: resources
      - path: Resources/ClawdWink.png
        buildPhase: resources
      - path: Resources/ClawdWave.png
        buildPhase: resources
    entitlements:
      path: QuotaGlance.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.example.quotaglance
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.example.quotaglance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.quotaglance
        PRODUCT_NAME: Quota Glance
        EXECUTABLE_NAME: QuotaGlance
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
schemes:
  QuotaGlance:
    build:
      targets:
        QuotaGlance: all
