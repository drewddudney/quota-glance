name: QuotaGlanceMobile
options:
  bundleIdPrefix: com.drewdudney
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 5DYDN5X5T2
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 31
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  QuotaGlanceMobile:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/QuotaGlanceMobile.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.drewdudney.quotaglance
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.ubiquity-kvstore-identifier: 5DYDN5X5T2.com.drewdudney.quotaglance
        com.apple.security.application-groups:
          - group.com.drewdudney.quotaglance
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewdudney.quotaglance.mobile
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: QuotaGlanceWidgets
        embed: true
  QuotaGlanceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/QuotaGlanceWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.drewdudney.quotaglance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewdudney.quotaglance.mobile.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
  QuotaGlanceMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: QuotaGlanceMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewdudney.quotaglance.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QuotaGlanceMobile:
    build:
      targets:
        QuotaGlanceMobile: all
        QuotaGlanceMobileTests: [test]
    test:
      targets:
        - QuotaGlanceMobileTests
